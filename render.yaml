services:
  - type: web
    name: hotel-kubera-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESTAURANT_NAME
        value: "Hotel Kubera"
      - key: RESTAURANT_CITY
        value: "Eluru"
      - key: RESTAURANT_TAGLINE
        value: "Taste the Wealth of Flavours"
